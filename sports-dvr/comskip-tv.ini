; comskip-tv.ini
; Standard TV commercial detection (non-sports)
; Higher confidence thresholds, no sports heuristics
; Used for regular TV show recordings
;
; Usage: ./comskip-cut.sh input.mp4 output.mp4 --ini=comskip-tv.ini

; Detection methods: black frame(1) + logo(2) + scene change(4) + resolution(8) + CC(16) + AR(32) + silence(64)
detect_method=111

; Verbose level
verbose=3

; === BLACK FRAME DETECTION ===
max_brightness=60
test_brightness=40
max_avg_brightness=25

; === SILENCE/AUDIO DETECTION ===
max_volume=500
max_silence=100
min_silence=12

; === LOGO DETECTION ===
; TV shows typically have consistent network logos
logo_threshold=0.75
shrink_logo=9.0
punish_no_logo=1

; === COMMERCIAL LENGTH PARAMETERS ===
; Standard TV commercials: 15s, 30s, 60s
; Breaks are typically 2-4 minutes
min_commercialbreak=30
max_commercialbreak=600
max_commercial_size=120
min_commercial_size=10
min_show_segment_length=60

; === SCORING THRESHOLDS ===
; Higher threshold for TV (more confident detections)
global_threshold=1.05

; Require standard commercial lengths (15s, 30s, 60s multiples)
require_div5=1

; === SCORING MODIFIERS ===
logo_present_modifier=0.005
punish_modifier=2.0
punish_threshold=1.3

length_strict_modifier=3.0
length_nonstrict_modifier=1.5
combined_length_strict_modifier=2.0
combined_length_nonstrict_modifier=1.0

validate_silence=1
validate_uniform=1
validate_scenechange=1

brightness_jump=200
schange_threshold=90

; === HEURISTICS ===
disable_heuristics=0
aggressive_logo_rejection=0

; === OUTPUT ===
output_edl=1

added_recording=0
padding=5
remove_before=0
remove_after=0

non_uniformity=500

; === SPORTS MODE ===
; Disabled for regular TV
sports_mode=0

; === BLOCK COMBINATION ===
max_repair_size=40

dark_block_modifier=0.3
