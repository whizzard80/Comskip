# sports-leagues.conf - Maps EPG program titles to league info for sports DVR post-processing
#
# Format: PATTERN | ABBREVIATION | FOLDER_NAME | SEASON_TYPE
#
# PATTERN:       Glob-style match against Jellyfin DVR program title (case-insensitive)
# ABBREVIATION:  Short prefix used in filenames (e.g., MLB, NBA, NFL)
# FOLDER_NAME:   League folder under the sports library root
# SEASON_TYPE:   "year" for calendar-year seasons, "year-year" for split-year
#
# Patterns are checked top-to-bottom, first match wins.
# Put specific patterns before broad ones.
# Lines starting with # are comments. Blank lines are ignored.

# ── American Football ──────────────────────────────────────────────
NFL Football*          | NFL      | Football.NFL            | year
*NFL*                  | NFL      | Football.NFL            | year
NCAA Football*         | NCAAF    | Football.NCAA           | year
College Football*      | NCAAF    | Football.NCAA           | year
*NCAA*Football*        | NCAAF    | Football.NCAA           | year

# ── Basketball ─────────────────────────────────────────────────────
# WNBA/Women's patterns must come before *NBA* to avoid false match
WNBA*                 | WNBA     | Basketball.WNBA          | year
*WNBA*                | WNBA     | Basketball.WNBA          | year
*Women*Pro*Basketball* | WNBA     | Basketball.WNBA          | year
Women's College Basketball* | WCBB | Basketball.WCBB        | year-year
*Women*College*Basketball* | WCBB | Basketball.WCBB          | year-year
*NCAA*Women*Basketball*| WCBB    | Basketball.WCBB          | year-year
College Basketball*    | NCAA     | Basketball.NCAA          | year-year
NCAA Basketball*       | NCAA     | Basketball.NCAA          | year-year
*NCAA*Basketball*      | NCAA     | Basketball.NCAA          | year-year
*March Madness*        | NCAA     | Basketball.NCAA          | year-year
*NCAA Tournament*      | NCAA     | Basketball.NCAA          | year-year
*Final Four*           | NCAA     | Basketball.NCAA          | year-year
*NIT*Basketball*       | NCAA     | Basketball.NCAA          | year-year
NBA Basketball*        | NBA      | Basketball.NBA           | year-year
*NBA*                  | NBA      | Basketball.NBA           | year-year

