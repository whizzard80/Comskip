; comskip-sports.ini
; Sports-optimized commercial detection for basketball, football, baseball
; Tuned for broadcasts where commercial breaks are signaled by black frames + silence
;
; Usage: ./comskip-fork.sh --ini=comskip-sports.ini video.mp4

; Use all detection methods: black frame(1) + logo(2) + scene change(4) + resolution(8) + CC(16) + AR(32) + silence(64) = 127
detect_method=127

; Verbose level (5 = detailed, 3 = moderate, 0 = quiet)
verbose=5

; === BLACK FRAME DETECTION ===
; Sports broadcasts use clean black frames between content and commercials
; Be generous - the black frames in sports transitions are very clean
max_brightness=60
test_brightness=40
max_avg_brightness=25

; === SILENCE/AUDIO DETECTION ===
; Sports transitions have true silence (no audio at all)
; Lower these to catch the brief silence at transition points
max_volume=500
max_silence=100
min_silence=12

; === LOGO DETECTION ===
; NBC/ESPN/etc logos are present during gameplay
; Logo disappears during commercials - this is a strong signal
logo_threshold=0.70
shrink_logo=9.0
punish_no_logo=1

; === COMMERCIAL LENGTH PARAMETERS ===
; Sports commercial breaks are 2-4 minutes (clusters of 30s ads)
; Halftime can be 14-20 minutes
; Individual ads are standard (15s, 30s, 60s)
min_commercialbreak=25
max_commercialbreak=1200
max_commercial_size=180
min_commercial_size=4
min_show_segment_length=30

; === SCORING THRESHOLDS ===
; Lower the threshold - sports breaks are harder to classify
global_threshold=1.02

; Disable require_div5 - sports breaks don't follow strict timing
require_div5=0

; === SCORING MODIFIERS ===
; Boost the impact of logo presence/absence
logo_present_modifier=0.005
punish_modifier=2.5
punish_threshold=1.2

; Reward blocks matching standard commercial lengths
length_strict_modifier=3.5
length_nonstrict_modifier=1.8
combined_length_strict_modifier=2.5
combined_length_nonstrict_modifier=1.5

; Boost the impact of silence detection
; (silence at break boundaries is the strongest signal in sports)
validate_silence=1
validate_uniform=1
validate_scenechange=1

; Scene change sensitivity
brightness_jump=150
schange_threshold=85

; === HEURISTICS ===
; Enable all heuristics
disable_heuristics=0

; Don't be too aggressive with logo rejection
aggressive_logo_rejection=0

; === OUTPUT ===
; Generate EDL file for Jellyfin
output_edl=1

; Added recording margin (seconds at start/end to account for DVR padding)
added_recording=0

; Padding around commercial boundaries (frames)
padding=5
remove_before=0
remove_after=0

; Non-uniformity threshold - lower to catch more uniform (solid color) frames
non_uniformity=500

; === SPORTS MODE ===
; 0=off, 1=basketball, 2=football, 3=baseball, 4=soccer, 5=fight, 6=hockey, 7=generic sports
; Each mode applies sport-specific presets automatically. Values below override presets.
sports_mode=4

; Timing parameters (optional - presets are applied per sport)
; Uncomment to override the sport-specific presets:
;sports_min_break=60
;sports_max_break=600
;sports_timeout_min=60
;sports_timeout_max=240
;sports_halftime_min=600
;sports_halftime_max=1200

; Break tolerance: allows breaks to be shorter/longer than expected
; 0.20 = 20% tolerance (a 60s min becomes 48s, a 600s max becomes 720s)
sports_break_tolerance=0.20

; Audio analysis: compare block audio to game audio fingerprint
; Game audio (crowd noise, announcer) is consistent; commercial audio differs
sports_use_audio=1
sports_audio_weight=1.0

; Scene change analysis: commercials have faster scene cuts than gameplay
sports_use_schange=1
sports_schange_weight=1.0

; Boundary padding: expand commercial boundaries to catch bumper/inbump clips
; "Bump" = brief pre-commercial transition clip (~3-5 seconds)
; "Inbump" = post-commercial return animation (~3-5 seconds)
sports_start_pad=5.0
sports_end_pad=5.0

; === BLOCK COMBINATION ===
; Allow more aggressive block combination for sports
; (multiple 30s ads form a single commercial break)
max_repair_size=80

; Dark block modifier - black transitions should strongly indicate commercials
dark_block_modifier=0.2
